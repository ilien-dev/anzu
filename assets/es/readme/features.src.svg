<rect x="674" y="220" width="234" height="10" rx="5" fill="$quiet"/><rect class="bar" x="674" y="220" width="234" height="10" rx="5" fill="$epub"/>
<g class="press" data-clickable="true"><rect x="674" y="254" width="234" height="48" rx="12" fill="$action"/><text class="b" x="791" y="284" font-size="15" fill="$onaction" text-anchor="middle">Desbloquear y convertir 2</text></g>
<g transform="translate(840 284)" data-kit="cursor" data-cursor="pointer"><g class="cur" opacity="0"><path d="M0 0l0 30 8-7 6 14 6-3-6-13 11 0z" fill="$ink" stroke="$bg" stroke-width="2"/></g></g>
