<text class="s" x="976" y="320" font-size="16" fill="$body">Carpeta de Kindle</text>
<g transform="translate(1104 226)"><g class="seal"><g data-asset="lucide:shield-check" data-icon="nothing in it was changed" data-size="64" transform="translate(0 0) scale(2.667)" fill="$okink"><g fill="none" stroke="$okink" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12l2 2l4-4"/></g></g></g></g>
