<text class="b say" opacity="0" style="animation-delay:0s" x="880" y="112" font-size="26" fill="$ink">Kobo, móvil, portátil</text>
<text class="b say" opacity="0" style="animation-delay:-12s" x="880" y="112" font-size="26" fill="$ink">Solo Anzu</text>
<text class="b say" opacity="0" style="animation-delay:-8s" x="880" y="112" font-size="26" fill="$ink">Pulsas y esperas</text>
<text class="b say" style="animation-delay:-4s" x="880" y="112" font-size="26" fill="$ink">Nada cambia</text>
<g transform="translate(1124 64)"><rect class="pip" style="animation-delay:0s" width="8" height="8" rx="4" fill="$accent"/></g>
