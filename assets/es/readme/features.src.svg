<rect class="lit" style="animation-delay:-4s" x="954" y="192" width="278" height="224" rx="18" fill="none" stroke="$accent" stroke-width="3"/>
<text class="b" x="978" y="392" font-size="19" fill="$ink">Kindle intacto</text>
