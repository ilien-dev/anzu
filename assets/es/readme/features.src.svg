<g transform="translate(1172 64)"><rect class="pip" style="animation-delay:-8s" width="8" height="8" rx="4" fill="$accent"/></g>
<g transform="translate(1196 64)"><rect class="pip" style="animation-delay:-4s" width="8" height="8" rx="4" fill="$accent"/></g>
