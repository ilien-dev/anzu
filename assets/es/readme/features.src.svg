<rect class="lit" opacity="0" style="animation-delay:-8s" x="652" y="192" width="278" height="224" rx="18" fill="none" stroke="$accent" stroke-width="3"/>
<text class="b" x="676" y="392" font-size="19" fill="$ink">Un botón</text>
