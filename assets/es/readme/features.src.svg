<rect class="lit" opacity="0" style="animation-delay:0s" x="48" y="192" width="278" height="224" rx="18" fill="none" stroke="$accent" stroke-width="3"/>
<text class="b" x="72" y="392" font-size="19" fill="$ink">Cualquier lector</text>
