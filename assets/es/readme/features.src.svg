<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="Lo que obtienes con Anzu, una ventaja cada vez: un archivo EPUB va a un lector electrónico, un móvil y un portátil; Calibre, los plugins y una app de Kindle vieja quedan tachados porque Anzu no necesita ninguno; se pulsa un solo botón, Desbloquear y convertir 2 libros; y la carpeta de Kindle recibe una marca porque Anzu nunca la cambia.">
<style>
@keyframes lit{0%,1%{opacity:0}4%,23%{opacity:1}26%,100%{opacity:0}}
.lit{animation:lit 16s ease-in-out infinite}
@keyframes say{0%,1%{opacity:0}4%,23%{opacity:1}26%,100%{opacity:0}}
.say{animation:say 16s ease-in-out infinite}
@keyframes hop1{0%,3%{transform:translate(0,0);opacity:0}4%{opacity:1}9%{transform:translate(76px,0);opacity:1}10%,100%{transform:translate(76px,0);opacity:0}}
@keyframes hop2{0%,8%{transform:translate(0,0);opacity:0}9%{opacity:1}14%{transform:translate(130px,0);opacity:1}15%,100%{transform:translate(130px,0);opacity:0}}
@keyframes hop3{0%,13%{transform:translate(0,0);opacity:0}14%{opacity:1}19%{transform:translate(188px,0);opacity:1}20%,100%{transform:translate(188px,0);opacity:0}}
.hop1{animation:hop1 16s cubic-bezier(.4,0,.2,1) infinite}.hop2{animation:hop2 16s cubic-bezier(.4,0,.2,1) infinite}.hop3{animation:hop3 16s cubic-bezier(.4,0,.2,1) infinite}
@keyframes scr1{0%,9%{opacity:0}11%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes scr2{0%,14%{opacity:0}16%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes scr3{0%,19%{opacity:0}21%,94%{opacity:1}98%,100%{opacity:0}}
.scr1{animation:scr1 16s ease-out infinite}.scr2{animation:scr2 16s ease-out infinite}.scr3{animation:scr3 16s ease-out infinite}
@keyframes strike1{0%,28%{transform:scaleX(0)}32%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
@keyframes strike2{0%,33%{transform:scaleX(0)}37%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
@keyframes strike3{0%,38%{transform:scaleX(0)}42%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
.strike1,.strike2,.strike3{transform-box:fill-box;transform-origin:0 50%}
.strike1{animation:strike1 16s cubic-bezier(.4,0,.2,1) infinite}.strike2{animation:strike2 16s cubic-bezier(.4,0,.2,1) infinite}.strike3{animation:strike3 16s cubic-bezier(.4,0,.2,1) infinite}
@keyframes cur{0%,50%{transform:translate(70px,60px);opacity:0}53%{opacity:1}60%,68%{transform:translate(0,0);opacity:1}74%,100%{transform:translate(70px,60px);opacity:0}}
.cur{animation:cur 16s cubic-bezier(.4,0,.2,1) infinite}
@keyframes press{0%,61%{transform:scale(1)}63%{transform:scale(.93)}66%,100%{transform:scale(1)}}
.press{animation:press 16s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bar{0%,63%{transform:scaleX(0)}72%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
.bar{animation:bar 16s cubic-bezier(.4,0,.2,1) infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes seal{0%,77%{transform:scale(.4);opacity:0}81%,94%{transform:scale(1);opacity:1}98%,100%{transform:scale(.4);opacity:0}}
.seal{animation:seal 16s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes pip{0%,1%{transform:scaleX(1)}4%,23%{transform:scaleX(2.4)}26%,100%{transform:scaleX(1)}}
.pip{animation:pip 16s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
</style>
<rect width="1280" height="448" fill="$bg"/>
<g id="backdrop" data-backdrop="chevrons still"><defs><pattern id="bd-chevrons" width="40" height="32" patternUnits="userSpaceOnUse"><path d="M17 11l5 5-5 5" fill="none" stroke="$dot" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></pattern></defs><rect x="-40" y="-32" width="1360" height="512" fill="url(#bd-chevrons)"/></g>
<text id="eyebrow" class="m" x="48" y="56" font-size="15" letter-spacing="2" fill="$accent">LO QUE OBTIENES</text>
<text id="title" class="b" x="48" y="104" font-size="36" fill="$ink">Tus libros, a cualquier lector</text>
<text id="sub" class="s" x="48" y="142" font-size="19" fill="$body">Sin herramientas extra, y tu biblioteca de Kindle se queda como estaba.</text>
