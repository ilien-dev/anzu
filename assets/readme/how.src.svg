<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="How Anzu works: in the Anzu window a cursor ticks two books, Moby-Dick and Pride and Prejudice, presses Unlock and convert 2 books, answers Close Kindle and continue in a dialog that says the Kindle app is open, and then each book fills its three-colour track from with DRM to EPUB. A list on the left lights each step as it happens.">
<style>
@keyframes step1{0%,1%{opacity:0}3%,22%{opacity:1}24%,100%{opacity:0}}
@keyframes step2{0%,23%{opacity:0}25%,31%{opacity:1}33%,100%{opacity:0}}
@keyframes step3{0%,31%{opacity:0}33%,49%{opacity:1}52%,100%{opacity:0}}
@keyframes step4{0%,50%{opacity:0}53%,92%{opacity:1}96%,100%{opacity:0}}
.step1{animation:step1 12s ease-in-out infinite}.step2{animation:step2 12s ease-in-out infinite}.step3{animation:step3 12s ease-in-out infinite}.step4{animation:step4 12s ease-in-out infinite}
@keyframes cur{0%,1%{transform:translate(0,0)}9%,13%{transform:translate(-540px,-238px)}17%,19%{transform:translate(-540px,-150px)}25%,30%{transform:translate(-96px,-26px)}41%,46%{transform:translate(-210px,-90px)}56%,100%{transform:translate(0,0)}}
.cur{animation:cur 12s cubic-bezier(.4,0,.2,1) infinite}
@keyframes cur-ptr{0%{opacity:0}25%{opacity:0}25.5%,30%{opacity:1}30.5%{opacity:0}41%{opacity:0}41.5%,47%{opacity:1}47.5%{opacity:0}100%{opacity:0}}@keyframes cur-arr{0%{opacity:1}25%{opacity:1}25.5%,30%{opacity:0}30.5%{opacity:1}41%{opacity:1}41.5%,47%{opacity:0}47.5%{opacity:1}100%{opacity:1}}.cur-ptr{animation:cur-ptr 12.0s step-end infinite}.cur-arr{animation:cur-arr 12.0s step-end infinite}
@keyframes tick1{0%,10%{opacity:0}12%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes tick2{0%,18%{opacity:0}19%,94%{opacity:1}98%,100%{opacity:0}}
.tick1{animation:tick1 12s ease-out infinite}.tick2{animation:tick2 12s ease-out infinite}
@keyframes press{0%,26%{transform:scale(1)}28%{transform:scale(.94)}31%,100%{transform:scale(1)}}
.press{animation:press 12s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dlg{0%,31%{opacity:0;transform:translateY(12px)}34%,46%{opacity:1;transform:translateY(0)}50%,100%{opacity:0;transform:translateY(12px)}}
.dlg{animation:dlg 12s cubic-bezier(0,0,.2,1) infinite}
@keyframes dpress{0%,43%{transform:scale(1)}45%{transform:scale(.94)}48%,100%{transform:scale(1)}}
.dpress{animation:dpress 12s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes a1{0%,50%{transform:scaleX(0)}55%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
@keyframes a2{0%,58%{transform:scaleX(0)}63%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
@keyframes a3{0%,66%{transform:scaleX(0)}71%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
@keyframes b1{0%,56%{transform:scaleX(0)}61%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
@keyframes b2{0%,66%{transform:scaleX(0)}71%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
@keyframes b3{0%,76%{transform:scaleX(0)}81%,94%{transform:scaleX(1)}98%,100%{transform:scaleX(0)}}
.a1,.a2,.a3,.b1,.b2,.b3{transform-box:fill-box;transform-origin:0 50%}
.a1{animation:a1 12s cubic-bezier(.4,0,.2,1) infinite}.a2{animation:a2 12s cubic-bezier(.4,0,.2,1) infinite}.a3{animation:a3 12s cubic-bezier(.4,0,.2,1) infinite}.b1{animation:b1 12s cubic-bezier(.4,0,.2,1) infinite}.b2{animation:b2 12s cubic-bezier(.4,0,.2,1) infinite}.b3{animation:b3 12s cubic-bezier(.4,0,.2,1) infinite}
</style>
<rect width="1280" height="448" fill="$bg"/>
<g id="backdrop" data-backdrop="chevrons still"><defs><pattern id="bd-chevrons" width="40" height="32" patternUnits="userSpaceOnUse"><path d="M17 11l5 5-5 5" fill="none" stroke="$dot" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></pattern></defs><rect x="-40" y="-32" width="1360" height="512" fill="url(#bd-chevrons)"/></g>
<text id="eyebrow" class="m" x="48" y="56" font-size="15" letter-spacing="2" fill="$accent">HOW IT WORKS</text>
<text id="title" class="b" x="48" y="104" font-size="36" fill="$ink">Tick, press, and wait</text>
<text id="sub" class="s" x="48" y="142" font-size="19" fill="$body">Anzu asks first, then each book fills its track.</text>
<g id="stage">
<rect x="48" y="192" width="440" height="44" rx="12" fill="$panel" stroke="$line" stroke-width="1.5"/>
<rect class="step1" opacity="0" x="48" y="192" width="440" height="44" rx="12" fill="$selbg" stroke="$accent" stroke-width="2"/>
<circle cx="74" cy="214" r="13" fill="$quiet"/><text class="b" x="74" y="220" font-size="16" fill="$ink" text-anchor="middle">1</text>
<text class="s" x="100" y="220" font-size="17" fill="$ink">Tick your books</text>
<rect x="48" y="248" width="440" height="44" rx="12" fill="$panel" stroke="$line" stroke-width="1.5"/>
<rect class="step2" opacity="0" x="48" y="248" width="440" height="44" rx="12" fill="$selbg" stroke="$accent" stroke-width="2"/>
<circle cx="74" cy="270" r="13" fill="$quiet"/><text class="b" x="74" y="276" font-size="16" fill="$ink" text-anchor="middle">2</text>
<text class="s" x="100" y="276" font-size="17" fill="$ink">Press one button</text>
<rect x="48" y="304" width="440" height="44" rx="12" fill="$panel" stroke="$line" stroke-width="1.5"/>
<rect class="step3" opacity="0" x="48" y="304" width="440" height="44" rx="12" fill="$selbg" stroke="$accent" stroke-width="2"/>
<circle cx="74" cy="326" r="13" fill="$quiet"/><text class="b" x="74" y="332" font-size="16" fill="$ink" text-anchor="middle">3</text>
<text class="s" x="100" y="332" font-size="17" fill="$ink">Let it close Kindle</text>
<rect x="48" y="360" width="440" height="44" rx="12" fill="$panel" stroke="$line" stroke-width="1.5"/>
<rect class="step4" x="48" y="360" width="440" height="44" rx="12" fill="$selbg" stroke="$accent" stroke-width="2"/>
<circle cx="74" cy="382" r="13" fill="$quiet"/><text class="b" x="74" y="388" font-size="16" fill="$ink" text-anchor="middle">4</text>
<text class="s" x="100" y="388" font-size="17" fill="$ink">Wait for the EPUB</text>
<rect x="560" y="40" width="672" height="376" rx="18" fill="$win" stroke="$rim" stroke-width="1.5"/>
<rect x="560" y="40" width="672" height="48" rx="18" fill="$shell"/><rect x="560" y="70" width="672" height="18" fill="$shell"/>
<g transform="translate(578 50) scale(0.44)"><rect width="64" height="64" rx="18" fill="$tile" stroke="$tilerim" stroke-width="3.41"/><g transform="translate(10.88 10.88) scale(0.66)"><path fill="$epub" d="M26 14H55A3 3 0 0 1 55 20H26ZM26 24H45A3 3 0 0 1 45 30H26ZM26 34H51A3 3 0 0 1 51 40H26ZM26 44H37A3 3 0 0 1 37 50H26Z"/><path fill="$drm" d="M13 14H28V20A2 2 0 0 0 28 24V30A2 2 0 0 0 28 34V40A2 2 0 0 0 28 44V50H13A7 7 0 0 1 6 43V21A7 7 0 0 1 13 14Z"/></g></g><text class="b" x="616" y="71" font-size="17" fill="$white">Anzu</text>
<rect x="580" y="108" width="324" height="80" rx="12" fill="$card" stroke="$edge" stroke-width="1.5"/>
<rect x="596" y="124" width="26" height="26" rx="7" fill="$win" stroke="$rim" stroke-width="2"/>
<g class="tick1"><rect x="596" y="124" width="26" height="26" rx="7" fill="$action"/><path d="M602 137l5 5 9-10" fill="none" stroke="$onaction" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="b" x="636" y="138" font-size="16" fill="$ink">Moby-Dick</text><text class="s" x="636" y="158" font-size="14" fill="$body">2.4 MB</text>
<rect x="724" y="148" width="50" height="10" rx="5" fill="$quiet"/><rect class="a1" x="724" y="148" width="50" height="10" rx="5" fill="$drm"/>
<rect x="782" y="148" width="50" height="10" rx="5" fill="$quiet"/><rect class="a2" x="782" y="148" width="50" height="10" rx="5" fill="$unl"/>
<rect x="840" y="148" width="50" height="10" rx="5" fill="$quiet"/><rect class="a3" x="840" y="148" width="50" height="10" rx="5" fill="$epub"/>
<rect x="580" y="200" width="324" height="80" rx="12" fill="$card" stroke="$edge" stroke-width="1.5"/>
<rect x="596" y="216" width="26" height="26" rx="7" fill="$win" stroke="$rim" stroke-width="2"/>
<g class="tick2"><rect x="596" y="216" width="26" height="26" rx="7" fill="$action"/><path d="M602 229l5 5 9-10" fill="none" stroke="$onaction" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="b" x="636" y="230" font-size="16" fill="$ink">Pride and Prejudice</text><text class="s" x="636" y="250" font-size="14" fill="$body">1.1 MB</text>
<rect x="724" y="240" width="50" height="10" rx="5" fill="$quiet"/><rect class="b1" x="724" y="240" width="50" height="10" rx="5" fill="$drm"/>
<rect x="782" y="240" width="50" height="10" rx="5" fill="$quiet"/><rect class="b2" x="782" y="240" width="50" height="10" rx="5" fill="$unl"/>
<rect x="840" y="240" width="50" height="10" rx="5" fill="$quiet"/><rect class="b3" x="840" y="240" width="50" height="10" rx="5" fill="$epub"/>
<rect x="580" y="300" width="324" height="10" rx="5" fill="$quiet"/><rect x="580" y="322" width="220" height="10" rx="5" fill="$quiet"/>
<rect x="922" y="104" width="290" height="292" rx="14" fill="$card" stroke="$edge" stroke-width="1.5"/>
<text class="b" x="942" y="140" font-size="20" fill="$ink">2 books</text><rect x="942" y="160" width="200" height="10" rx="5" fill="$quiet"/><rect x="942" y="182" width="150" height="10" rx="5" fill="$quiet"/>
<g class="press" data-clickable="true"><rect x="942" y="330" width="250" height="46" rx="12" fill="$action"/><text class="b" x="1067" y="359" font-size="15" fill="$onaction" text-anchor="middle">Unlock and convert 2 books</text></g>
<g class="dlg" opacity="0"><rect x="680" y="180" width="420" height="150" rx="16" fill="$panel" stroke="$accent" stroke-width="2"/><text class="b" x="704" y="220" font-size="19" fill="$ink">The Kindle app is open</text><rect x="704" y="236" width="300" height="9" rx="4.5" fill="$quiet"/><g class="dpress" data-clickable="true"><rect x="704" y="262" width="260" height="44" rx="12" fill="$action"/><text class="b" x="834" y="290" font-size="15" fill="$onaction" text-anchor="middle">Close Kindle and continue</text></g></g>
<g transform="translate(1150 380)"><g class="cur"><g data-kit="cursor-swap"><g class="cur-arr"><g data-kit="cursor" data-cursor="arrow" transform="translate(0.0 0.0) scale(1.08)"><path transform="translate(0 0)" d="M0 0V19L5 14.5L8.6 22.3L12 20.8L8.5 13.2H15Z" fill="$ink" stroke="$bg" stroke-width="1.6" stroke-linejoin="round"/></g></g><g class="cur-ptr" opacity="0"><g data-kit="cursor" data-cursor="pointer" transform="translate(0.0 0.0) scale(1.08)"><path transform="translate(-6.5 0)" d="M6.5 0C7.9 0 9 1.1 9 2.5V9.2C9.4 9 9.9 8.9 10.4 8.9C11.6 8.9 12.6 9.6 13 10.6C13.4 10.4 13.9 10.3 14.4 10.3C15.7 10.3 16.8 11.2 17.1 12.4C17.5 12.2 17.9 12.1 18.4 12.1C19.8 12.1 21 13.3 21 14.7V19C21 23.4 17.4 27 13 27H11.5C8.8 27 6.4 25.6 5 23.4L1 17C.3 15.9 .6 14.5 1.7 13.8C2.7 13.2 4 13.4 4.7 14.4L4 13.6V2.5C4 1.1 5.1 0 6.5 0Z" fill="$ink" stroke="$bg" stroke-width="1.6" stroke-linejoin="round"/></g></g></g></g></g>
</g>
</svg>
