<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Anzu: the logo, two wings over a tablet, opens and closes its wings. Kindle books with a lock flow in from the left and leave on the right as EPUB files. Below: Anzu, Kindle books to EPUB, on Windows.">
<style>
.wl{animation:wl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 0}
.wr{animation:wr 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0 0}
@keyframes wl{0%,100%{transform:rotate(0deg)}50%{transform:rotate(7deg)}}
@keyframes wr{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-7deg)}}
.tab{animation:tab 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes tab{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.inflow{animation:inflow 16s linear infinite}
@keyframes inflow{0%{transform:translateX(-440px)}100%{transform:translateX(0)}}
.outflow{animation:outflow 16s linear infinite}
@keyframes outflow{0%{transform:translateX(0)}100%{transform:translateX(440px)}}
.glow{animation:glow 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes glow{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.04)}}
</style>
<defs>
<radialGradient id="g"><stop offset="0" stop-color="$glow"/><stop offset="1" stop-color="$glow" stop-opacity="0"/></radialGradient>
<linearGradient id="fl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="470" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".3" stop-color="#fff"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<linearGradient id="fr" gradientUnits="userSpaceOnUse" x1="810" y1="0" x2="1280" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".28" stop-color="#fff"/><stop offset=".7" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="ml"><rect x="0" y="130" width="470" height="140" fill="url(#fl)"/></mask>
<mask id="mr"><rect x="810" y="130" width="470" height="140" fill="url(#fr)"/></mask>
</defs>
<rect width="1280" height="640" fill="$bg"/>
