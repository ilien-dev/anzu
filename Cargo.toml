[workspace]
resolver = "3"
members = ["crates/anzu-core", "crates/anzu-kfx", "crates/anzu", "crates/anzu-web"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The web demo (`site/scripts/build-demo.ts`): the release build, kept unstripped so
# wasm-bindgen can read its features, and optimised for size.
[profile.web]
inherits = "release"
strip = false
opt-level = "s"
