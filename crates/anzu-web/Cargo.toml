[package]
name = "anzu-web"
description = "The Anzu window as a WebAssembly demo for the product site"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Only the web build has anything in it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
anzu = { path = "../anzu" }
anzu-core = { path = "../anzu-core" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
js-sys = "0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["HtmlCanvasElement"] }
