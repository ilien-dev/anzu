[package]
name = "anzu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anzu-core = { path = "../anzu-core" }
anzu-kfx = { path = "../anzu-kfx" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.37.0"
rfd = "0.18.0"

# The web demo draws with WebGL through glow: the same egui meshes and font atlas as the
# app, at a fraction of the size of wgpu.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }

[build-dependencies]
embed-resource = "3.0.12"
